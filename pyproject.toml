[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chat-to-llm"
version = "0.1.0"
description = "Local ChatGPT-to-OpenAI API server using browser cookies"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "curl_cffi>=0.7",
    "python-dotenv",
    "browser-cookie3>=0.19",
    "pyjwt",
    "pybase64",
    "ua-generator",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "httpx",
]

[tool.hatch.build.targets.wheel]
packages = ["providers", "api"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
